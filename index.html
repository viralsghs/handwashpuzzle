<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hand Hygiene Puzzle - Marengo Asia Hospitals</title>
<style>
:root{--b:#0a3cff;--s:#0a9bff;--o:#ff4a0a;--g:#16a34a;--r:#dc2626;--ink:#0f1b3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;color:var(--ink);background:linear-gradient(170deg,#eaf1ff,#fff 55%,#e3f3ff);min-height:100vh}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:#fff;box-shadow:0 2px 12px #0a3cff25}
header img{height:42px;width:auto}
.tools{display:flex;gap:6px}
.tools button{border:2px solid var(--b);background:#fff;color:var(--b);border-radius:20px;padding:7px 12px;font-weight:700;font-size:14px}
main{max-width:980px;margin:auto;padding:12px 12px 120px}
.panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 28px #0a3cff1f;max-width:520px;margin:10px auto}
h1{font-size:26px;margin:4px 0;color:var(--b);line-height:1.15}
.sub{margin:0 0 12px;color:#41507a}
.rules{background:#eef4ff;border-left:5px solid var(--o);padding:10px 12px;border-radius:8px;font-size:14px;line-height:1.4;margin-bottom:14px}
label{font-weight:700;font-size:14px}
input,select{width:100%;padding:14px;font-size:16px;border:2px solid #cdd8ff;border-radius:12px;margin:5px 0 4px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:3px solid #0a9bff55;border-color:var(--s)}
input:disabled,select:disabled{background:#eef2ff}
.msg{min-height:20px;font-size:13px;margin-bottom:8px;color:#41507a}
.btn{border:0;border-radius:14px;padding:15px 12px;font-size:16px;font-weight:800;color:#fff;background:var(--b);flex:1;box-shadow:0 4px 0 #0626a8}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0626a8}
.btn.o{background:var(--o);box-shadow:0 4px 0 #b32e00}.btn.s{background:var(--s);box-shadow:0 4px 0 #0674b8}.btn.w{background:#fff;color:var(--b);border:2px solid var(--b);box-shadow:none}
.btn:disabled{opacity:.45}
.stat{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;margin:4px 0 8px;flex-wrap:wrap}
.chip{background:#fff;border:2px solid #cdd8ff;border-radius:20px;padding:5px 12px;font-size:14px}
.tip{font-size:13px;color:#41507a;margin:0 0 8px}
#banner{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 6px 20px #0a3cff22}
.pb{height:14px;background:#e1e8ff;border-radius:8px;overflow:hidden;margin:8px 0}
.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--s),var(--g));transition:width .8s}
#board{display:grid;gap:8px;position:relative}
.slot{display:flex;align-items:center;gap:8px}
.num{flex:0 0 32px;height:32px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.card{flex:1;display:flex;align-items:center;gap:9px;padding:8px 10px;min-height:58px;background:#fff;border:2px solid #d3dcff;border-radius:12px;font-size:13.5px;line-height:1.25;cursor:grab;user-select:none;-webkit-user-select:none;transition:transform .15s,border-color .15s,background .3s}
.card .ic{flex:0 0 34px;text-align:center;font-size:25px}
.card img{flex:0 0 44px;width:44px;height:44px;object-fit:cover;border-radius:8px}
.card.sel{border-color:var(--o);box-shadow:0 0 0 4px #ff4a0a40;transform:scale(1.025)}
.card.lock{background:#e0f2fe;border-color:var(--s)}
.card.ok{background:#dcfce7;border-color:var(--g);animation:bounce .5s}
.card.bad{background:#fee2e2;border-color:var(--r);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes bounce{40%{transform:scale(1.04)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.win{position:absolute;inset:0;z-index:5;background:#fffffff2;border:4px solid var(--g);border-radius:18px;display:flex;justify-content:center;animation:pop .6s}
.win>div{position:sticky;top:90px;align-self:flex-start;text-align:center;padding:18px}
.win img{width:min(78vw,320px);height:auto}
.win h2{color:var(--g);font-size:30px;margin:8px 0}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -4px 18px #0a3cff30}
#bar .btn{font-size:14.5px;padding:14px 6px}
#cf{position:fixed;inset:0;z-index:60;pointer-events:none}
.tabs{display:flex;gap:8px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:0 2px 8px #0a3cff18}
.row.me{border:2px solid var(--o)}
.rk{flex:0 0 36px;font-size:22px;font-weight:800;text-align:center}
.row>div{flex:1;min-width:0}.row small{display:block;color:#5a6890}
.row b.pt{color:var(--b);font-size:18px;white-space:nowrap}
#cert{display:none;text-align:center;padding:30px;border:12px double var(--b);font-family:Georgia,serif}
#cert img{height:110px}#cert h1{font-size:40px}#cert h2{font-size:36px;color:var(--o);margin:10px 0}
@media(min-width:700px){#board{grid-template-columns:1fr 1fr;gap:10px 18px}.card{font-size:15px}main{padding-bottom:110px}#bar{padding-left:calc(50% - 300px);padding-right:calc(50% - 300px)}}
@media print{body>*:not(#cert){display:none!important}#cert{display:block}@page{size:landscape;margin:10mm}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><img id="logo" alt="Marengo Asia Hospitals"><div class="tools"><button id="mt" onclick="toggleMute()">🔊</button><button id="lg" onclick="toggleLang()">हिंदी</button></div></header>
<main>
<section id="s-start" class="panel">
 <h1 data-t="title"></h1><p class="sub" data-t="sub"></p>
 <div class="rules" data-t="rules"></div>
 <label for="eid" data-t="id"></label><input id="eid" autocomplete="off" autocapitalize="characters" inputmode="text" onchange="lookup()">
 <div class="msg" id="idmsg"></div>
 <label for="ename" data-t="name"></label><input id="ename" autocomplete="off">
 <label for="edept" data-t="dept"></label><select id="edept"></select>
 <div class="msg"></div>
 <div style="display:flex;gap:8px"><button class="btn o" id="go" onclick="start()" data-t="start"></button><button class="btn w" onclick="lb()" data-t="lb"></button></div>
 <p class="msg" style="margin-top:14px;font-size:12px">Based on the WHO "How to Handwash" poster · v1.0</p>
</section>
<section id="s-game" hidden>
 <div class="stat"><span class="chip">⏱ <span id="tm">00:00</span></span><span class="chip"><span data-t="att"></span> <span id="an">1</span></span><span class="chip" id="who"></span></div>
 <p class="tip" id="tip"></p>
 <div id="banner" hidden><div id="bt"></div><div id="sv" class="msg"></div></div>
 <div id="board"></div>
</section>
<section id="s-lb" hidden>
 <div class="tabs"><button class="btn w" onclick="back()" data-t="back"></button><button class="btn" id="t1" onclick="tab('top')" data-t="top"></button><button class="btn w" id="t2" onclick="tab('dep')" data-t="deps"></button></div>
 <div id="lbc"></div>
</section>
</main>
<div id="bar" hidden></div>
<canvas id="cf" hidden></canvas>
<div id="cert"><img id="clogo" alt=""><h1 id="ct1"></h1><p id="cp1"></p><h2 id="cn"></h2><p id="cd"></p><p id="cp2"></p></div>
<script>
const CFG={api:"https://script.google.com/macros/s/AKfycbx11nLabbLBmH3HkjAQpYRpHPZwMktV3DI-SK-v9sQSpTE6rFn2CFVAwtCjSe5v1pGP/exec",logo:"MAH_Logo.jpg",allowUnlisted:true,ver:"1.0"};
const steps=[
["💧","Wet hands with water","हाथों को पानी से गीला करें"],
["🧴","Apply enough soap to cover all hand surfaces","सभी सतहों को ढकने के लिए पर्याप्त साबुन लगाएँ"],
["👏","Rub hands palm to palm","हथेली से हथेली रगड़ें"],
["🤲","Right palm over left dorsum with interlaced fingers and vice versa","दाईं हथेली को बाएँ हाथ के पिछले भाग पर, उंगलियाँ फँसाकर रगड़ें और उल्टा"],
["🙏","Palm to palm with fingers interlaced","उंगलियाँ फँसाकर हथेली से हथेली रगड़ें"],
["🤝","Backs of fingers to opposing palms with fingers interlocked","उंगलियों के पिछले भाग को विपरीत हथेली पर रगड़ें"],
["👍","Rotational rubbing of left thumb clasped in right palm and vice versa","बाएँ अंगूठे को दाईं हथेली में पकड़कर घुमाकर रगड़ें और उल्टा"],
["✋","Rotational rubbing, backwards and forwards with clasped fingers of right hand in left palm and vice versa","दाएँ हाथ की उंगलियों को बाईं हथेली में आगे-पीछे घुमाकर रगड़ें और उल्टा"],
["🚿","Rinse hands with water","हाथों को पानी से धोएँ"],
["🧻","Dry hands thoroughly with a single use towel","एक बार उपयोग वाले तौलिये से हाथ अच्छी तरह सुखाएँ"],
["🚰","Use towel to turn off faucet","तौलिये से नल बंद करें"],
["✅","Your hands are now safe","आपके हाथ अब सुरक्षित हैं"]];
const T={en:{title:"Hand Hygiene Puzzle",sub:"Put the WHO handwash steps in the correct order",rules:"Tap a card, then tap another card to swap them. Each correct step gives 10 points. A perfect and fast run earns a bonus. You get 2 hints (-5 points each).",id:"Employee ID",name:"Employee name",dept:"Department",sel:"Select department",start:"Start game",found:"ID verified ✔",manual:"ID not in the list. Enter your name and department.",notfound:"ID not found. Please check your ID.",offline:"Cannot reach the server. Check your internet.",att:"Attempt",hint:"Hint",check:"Check answer",ans:"Show correct order",again:"Play again",lb:"Leaderboard",cert:"Certificate",tip:"Steps 0 to 11 must run in order from top to bottom. Tap a card, then tap another to swap.",ok:"correct",pts:"points",cong:"Congratulations!",perfect:"Perfect! You know all 12 steps. Clean hands save lives.",good:"Almost there! Red cards are in the wrong place.",low:"Keep practising! Red cards are in the wrong place.",showing:"This is the correct order. Study it, then play again.",saving:"Saving…",saved:"Saved ✔",retry:"Not saved yet. It will retry automatically.",top:"Top staff",deps:"Departments",back:"Back",players:"played",avg:"avg best",certT:"Certificate of Achievement",certP:"This is to certify that",certP2:"completed the WHO hand hygiene puzzle with a perfect score",fill:"Please fill in all fields.",empty:"No scores yet. Be the first to play.",best:"Best"},
hi:{title:"हैंड हाइजीन पज़ल",sub:"WHO हाथ धोने के स्टेप सही क्रम में लगाएँ",rules:"एक कार्ड पर टैप करें, फिर दूसरे कार्ड पर टैप करके जगह बदलें। हर सही स्टेप के 10 पॉइंट। परफेक्ट और तेज़ होने पर बोनस। 2 हिंट मिलते हैं (हर हिंट -5 पॉइंट)।",id:"कर्मचारी ID",name:"कर्मचारी का नाम",dept:"विभाग",sel:"विभाग चुनें",start:"गेम शुरू करें",found:"ID सत्यापित ✔",manual:"ID सूची में नहीं है। अपना नाम और विभाग भरें।",notfound:"ID नहीं मिली। कृपया ID जाँचें।",offline:"सर्वर से संपर्क नहीं हुआ। इंटरनेट जाँचें।",att:"प्रयास",hint:"हिंट",check:"उत्तर जाँचें",ans:"सही क्रम देखें",again:"फिर खेलें",lb:"लीडरबोर्ड",cert:"प्रमाणपत्र",tip:"स्टेप 0 से 11 ऊपर से नीचे क्रम में होने चाहिए। कार्ड पर टैप करें, फिर दूसरे पर टैप करके बदलें।",ok:"सही",pts:"पॉइंट",cong:"बधाई हो!",perfect:"शानदार! आपको सभी 12 स्टेप आते हैं। साफ़ हाथ, जीवन की सुरक्षा।",good:"बस थोड़ा और! लाल कार्ड गलत जगह पर हैं।",low:"अभ्यास करते रहें! लाल कार्ड गलत जगह पर हैं।",showing:"यह सही क्रम है। इसे देखें और फिर खेलें।",saving:"सेव हो रहा है…",saved:"सेव हो गया ✔",retry:"अभी सेव नहीं हुआ। अपने आप दोबारा कोशिश होगी।",top:"टॉप स्टाफ",deps:"विभाग",back:"वापस",players:"खेले",avg:"औसत बेस्ट",certT:"उपलब्धि प्रमाणपत्र",certP:"प्रमाणित किया जाता है कि",certP2:"ने WHO हैंड हाइजीन पज़ल पूरे अंकों के साथ पूरा किया",fill:"कृपया सभी जानकारी भरें।",empty:"अभी कोई स्कोर नहीं। सबसे पहले खेलें।",best:"बेस्ट"}};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={g(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let L=ls.g("hl")||"en";const t=k=>T[L][k]||k;
const S={img:{},lock:new Set(),order:[],mute:false,tab:"top",attempt:1,prev:0};
const mmss=s=>String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function applyLang(){document.documentElement.lang=L;document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
 $("lg").textContent=L=="en"?"हिंदी":"English";$("tip").textContent=t("tip");
 const d=$("edept");if(d.options.length)d.options[0].textContent=t("sel");
 if(S.order.length&&!$("s-game").hidden){render();setBar();if(S.res)banner()}
 if(!$("s-lb").hidden)drawLB()}
function toggleLang(){L=L=="en"?"hi":"en";ls.s("hl",L);applyLang()}
function toggleMute(){S.mute=!S.mute;$("mt").textContent=S.mute?"🔇":"🔊"}
function show(id){["s-start","s-game","s-lb"].forEach(x=>$(x).hidden=x!=id);$("bar").hidden=id!="s-game";window.scrollTo(0,0)}
async function api(p){const r=await fetch(CFG.api+"?"+new URLSearchParams(p));return r.json()}
/* sound */
let ac;function tone(f,d=.1,ty="sine"){if(S.mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function fanfare(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.3,"triangle"),i*150))}
function confetti(){const c=$("cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;c.hidden=false;
 const cols=["#0a3cff","#0a9bff","#ff4a0a","#6b6b00","#16a34a","#facc15"];
 const P=Array.from({length:170},()=>({x:Math.random()*c.width,y:-Math.random()*c.height*.7,r:4+Math.random()*6,vy:2+Math.random()*4,vx:-2+Math.random()*4,a:Math.random()*6,k:cols[Math.random()*6|0]}));
 let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.k;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++n<280)requestAnimationFrame(f);else c.hidden=true})()}
/* start screen */
async function loadDeps(){const d=$("edept");let list;try{list=(await api({a:"init"})).departments}catch(e){}
 if(!list||!list.length)list=["Nursing","OPD","ICU","Laboratory","Pharmacy","Housekeeping","Other"];
 d.innerHTML="<option value=''></option>"+list.map(x=>"<option>"+esc(x)+"</option>").join("");applyLang()}
$("eid").addEventListener("input",()=>{S.lookId=null;$("ename").disabled=$("edept").disabled=false;$("idmsg").textContent=""});
async function lookup(){const id=$("eid").value.trim().toUpperCase();if(!id)return;$("eid").value=id;S.lookId=id;$("idmsg").textContent="…";
 try{const r=await api({a:"staff",id});S.found=!!r.found;S.prev=r.attempts||0;
  if(r.found){const d=$("edept");if(![...d.options].some(o=>o.value==r.dept)){const o=document.createElement("option");o.textContent=r.dept;d.append(o)}
   $("ename").value=r.name;d.value=r.dept;$("ename").disabled=d.disabled=true;$("idmsg").textContent=t("found")+(S.prev?"  ("+t("att")+" "+(S.prev+1)+")":"")}
  else $("idmsg").textContent=t(CFG.allowUnlisted?"manual":"notfound")}
 catch(e){S.found=false;S.prev=0;$("idmsg").textContent=t("offline")}}
async function start(){const id=$("eid").value.trim().toUpperCase();
 if(S.lookId!=id)await lookup();
 const name=$("ename").value.trim(),dept=$("edept").value;
 if(!id||!name||!dept){alert(t("fill"));return}
 if(!CFG.allowUnlisted&&!S.found){alert(t("notfound"));return}
 S.emp={id,name,dept};S.attempt=(S.prev||0)+1;$("who").textContent=name;show("s-game");newRound();tone(600,.1)}
/* game */
function shuf(){let a;do{a=[...Array(12).keys()];for(let i=11;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}}while(a.filter((v,i)=>v==i).length>1);return a}
function newRound(){S.order=shuf();S.sel=null;S.lock=new Set();S.hints=0;S.done=false;S.won=false;S.ans=false;S.res=null;S.t0=Date.now();$("banner").hidden=true;$("an").textContent=S.attempt;
 clearInterval(S.tm);S.tm=setInterval(()=>{if(!S.done)$("tm").textContent=mmss((Date.now()-S.t0)/1000|0)},500);$("tm").textContent="00:00";render();setBar()}
function render(){const b=$("board");b.innerHTML="";
 S.order.forEach((sid,i)=>{const s=document.createElement("div");s.className="slot";
  const n=document.createElement("b");n.className="num";n.textContent=i;
  const c=document.createElement("div");c.className="card";c.dataset.i=i;c.draggable=!S.done;
  let ic;if(S.img[sid]){ic=new Image();ic.src="img/s"+sid+".jpg";ic.alt=""}else{ic=document.createElement("span");ic.className="ic";ic.textContent=steps[sid][0]}
  const tx=document.createElement("span");tx.textContent=steps[sid][L=="hi"?2:1];c.append(ic,tx);
  if(S.ans)c.classList.add("lock");else if(S.done&&S.res)c.classList.add(sid==i?"ok":"bad");else{if(S.lock.has(i))c.classList.add("lock");if(S.sel===i)c.classList.add("sel")}
  s.append(n,c);b.append(s)});
 if(S.won){const w=document.createElement("div");w.className="win";w.innerHTML='<div><img src="'+CFG.logo+'" alt=""><h2>'+t("cong")+'</h2><p><b>'+esc(S.emp.name)+'</b></p><p>12/12 · '+S.res.p+' '+t("pts")+' · '+mmss(S.res.secs)+'</p></div>';b.append(w)}}
function swap(a,b){[S.order[a],S.order[b]]=[S.order[b],S.order[a]]}
$("board").addEventListener("click",e=>{const c=e.target.closest(".card");if(!c||S.done)return;const i=+c.dataset.i;if(S.lock.has(i))return;
 if(S.sel==null){S.sel=i;tone(520,.06)}else if(S.sel==i)S.sel=null;else{swap(S.sel,i);S.sel=null;tone(680,.08)}render()});
$("board").addEventListener("dragstart",e=>{const c=e.target.closest(".card");if(!c||S.done||S.lock.has(+c.dataset.i)){e.preventDefault();return}S.drag=+c.dataset.i;e.dataTransfer.setData("text","x")});
$("board").addEventListener("dragover",e=>e.preventDefault());
$("board").addEventListener("drop",e=>{e.preventDefault();const c=e.target.closest(".card");if(!c||S.drag==null)return;const i=+c.dataset.i;if(!S.lock.has(i)&&i!=S.drag){swap(S.drag,i);tone(680,.08)}S.drag=null;S.sel=null;render()});
function hint(){if(S.done||S.hints>=2)return;const i=S.order.findIndex((v,k)=>v!=k&&!S.lock.has(k));if(i<0)return;swap(S.order.indexOf(i),i);S.lock.add(i);S.hints++;S.sel=null;tone(880,.15,"triangle");render();setBar()}
function check(){if(S.done)return;S.done=true;clearInterval(S.tm);S.sel=null;
 const secs=(Date.now()-S.t0)/1000|0,c=S.order.filter((v,i)=>v==i).length,perfect=c==12,bonus=perfect?Math.max(0,60-(secs/5|0)):0;
 S.res={c,p:Math.max(0,c*10-S.hints*5)+bonus,secs,perfect,bonus};S.won=perfect;render();banner();setBar();window.scrollTo({top:0,behavior:"smooth"});
 if(perfect){fanfare();confetti()}else tone(170,.35,"sawtooth");save()}
function banner(){const r=S.res;$("banner").hidden=false;
 $("bt").innerHTML="<b>"+r.c+"/12 "+t("ok")+" · "+r.p+" "+t("pts")+" · "+mmss(r.secs)+"</b><div class='pb'><i style='width:"+(r.c/12*100)+"%'></i></div><div>"+t(S.ans?"showing":r.perfect?"perfect":r.c>=8?"good":"low")+"</div>"}
function showAns(){S.ans=true;S.order=[...Array(12).keys()];render();banner();setBar();window.scrollTo({top:0,behavior:"smooth"})}
function again(){S.attempt++;newRound()}
function setBar(){const B=$("bar");
 if(!S.done)B.innerHTML='<button class="btn s" onclick="hint()" '+(S.hints>=2?"disabled":"")+'>💡 '+t("hint")+' ('+(2-S.hints)+')</button><button class="btn o" onclick="check()">✔ '+t("check")+'</button>';
 else B.innerHTML=(S.res.perfect?'<button class="btn s" onclick="cert()">🏅 '+t("cert")+'</button>':S.ans?"":'<button class="btn s" onclick="showAns()">👁 '+t("ans")+'</button>')+'<button class="btn o" onclick="again()">🔄 '+t("again")+'</button><button class="btn" onclick="lb()">🏆 '+t("lb")+'</button>'}
/* saving */
async function post(d){try{const r=await fetch(CFG.api,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(d)});const j=await r.json();if(j.ok){if(j.attempt)S.attempt=j.attempt;return true}}catch(e){}return false}
async function save(){const r=S.res,d={a:"save",uid:Date.now()+"-"+Math.random().toString(36).slice(2,8),id:S.emp.id,name:S.emp.name,dept:S.emp.dept,correct:r.c,points:r.p,secs:r.secs,hints:S.hints,lang:L,ver:CFG.ver};
 $("sv").textContent=t("saving");
 if(await post(d)){$("sv").textContent=t("saved");flush()}else{const p=ls.g("pend")||[];p.push(d);ls.s("pend",p);$("sv").textContent=t("retry")}}
async function flush(){const p=ls.g("pend")||[];if(!p.length)return;const keep=[];for(const d of p)if(!(await post(d)))keep.push(d);ls.s("pend",keep)}
/* leaderboard + certificate */
async function lb(){show("s-lb");$("lbc").textContent="…";try{S.lbd=await api({a:"board"});drawLB()}catch(e){$("lbc").textContent=t("offline")}}
function tab(x){S.tab=x;drawLB()}
function back(){show(S.emp&&S.order.length?"s-game":"s-start")}
function drawLB(){const r=S.lbd;if(!r)return;$("t1").className="btn"+(S.tab=="top"?"":" w");$("t2").className="btn"+(S.tab=="dep"?"":" w");let h="";
 if(S.tab=="top"){if(!r.top||!r.top.length)h="<p>"+t("empty")+"</p>";
  (r.top||[]).forEach((x,i)=>{h+='<div class="row'+(S.emp&&x.n==S.emp.name&&x.d==S.emp.dept?" me":"")+'"><span class="rk">'+(["🥇","🥈","🥉"][i]||i+1)+'</span><div><b>'+esc(x.n)+'</b><small>'+esc(x.d)+' · '+mmss(x.s)+' · '+x.c+'/12</small></div><b class="pt">'+x.p+'</b></div>'})}
 else{(r.depts||[]).forEach((x,i)=>{h+='<div class="row"><span class="rk">'+(["🥇","🥈","🥉"][i]||i+1)+'</span><div><b>'+esc(x.d)+'</b><small>'+x.players+(x.total?"/"+x.total:"")+' '+t("players")+(x.total?" ("+Math.round(x.players/x.total*100)+"%)":"")+'</small><div class="pb"><i style="width:'+Math.min(100,x.avg/1.8)+'%"></i></div></div><b class="pt">'+x.avg+'</b></div>'})}
 $("lbc").innerHTML=h}
function cert(){$("clogo").src=CFG.logo;$("ct1").textContent=t("certT");$("cp1").textContent=t("certP");$("cn").textContent=S.emp.name;
 $("cd").textContent=S.emp.dept;$("cp2").textContent=t("certP2")+" ("+S.res.p+" "+t("pts")+") · "+new Date().toLocaleDateString();window.print()}
/* init */
$("logo").src=CFG.logo;
steps.forEach((_,i)=>{const im=new Image();im.onload=()=>S.img[i]=true;im.src="img/s"+i+".jpg"});
loadDeps();flush();show("s-start");
</script></body></html>
