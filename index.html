<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1437">
<title>Hand Hygiene Challenge</title>
<style>
:root{--b:#0a3cff;--s:#0a9bff;--o:#ff4a0a;--g:#22c55e;--r:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;color:#fff;min-height:100vh;background:radial-gradient(120% 50% at 85% 0,#0a3cff 0,transparent 60%),radial-gradient(90% 40% at 0 100%,#0a9bff55 0,transparent 60%),#0b1437;background-attachment:fixed}
[hidden]{display:none!important}
body.red{animation:red .45s 4}
@keyframes red{50%{box-shadow:inset 0 0 0 100vmax #ef444488}}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
header b{font-size:14px;opacity:.85}
.tools button{border:1px solid #ffffff44;background:#ffffff1f;color:#fff;border-radius:20px;padding:7px 13px;font-weight:700;font-size:14px;margin-left:6px}
main{max-width:560px;margin:auto;padding:6px 14px 190px}
.logo{display:block;margin:6px auto 14px;background:#fff;border-radius:24px;padding:12px 16px;width:200px;box-shadow:0 18px 44px #0a3cff80}
.logo img{width:100%;display:block}
h1{font-size:34px;line-height:1.1;margin:8px 0;font-weight:800}
p.sub{margin:0 0 16px;color:#ffffffc8;line-height:1.45}
label{font-weight:700;font-size:14px}
input{width:100%;height:58px;margin:7px 0 14px;padding:0 16px;font-size:19px;font-weight:700;color:#fff;background:#ffffff1f;border:2px solid #ffffff44;border-radius:16px;font-family:inherit}
input:focus{outline:0;border-color:var(--s);box-shadow:0 0 0 5px #0a9bff33}
input::placeholder{color:#ffffff80;font-weight:500}
.btn{border:0;border-radius:28px;height:56px;padding:0 18px;font:800 17px inherit;font-family:inherit;color:#fff;background:linear-gradient(90deg,#ff4a0a,#ff7a1a);box-shadow:0 10px 26px #ff4a0a55;flex:1}
.btn:active{transform:scale(.97)}.btn.w{background:transparent;border:2px solid #ffffff88;box-shadow:none}.btn.s{background:linear-gradient(90deg,#0a3cff,#0a9bff);box-shadow:0 10px 26px #0a3cff66}
.btn:disabled{opacity:.4}
.link{background:none;border:0;color:#7cc8ff;font:700 15px inherit;font-family:inherit;text-decoration:underline;padding:14px 0;width:100%}
.msg{color:#ffd9a8;font-size:14px;min-height:20px;margin:0 0 8px}
.stat{display:flex;justify-content:space-between;gap:8px;margin:4px 0 8px;font-weight:800;font-size:14px}
.chip{background:#ffffff1f;border-radius:20px;padding:7px 13px}
#bn{background:#ffffff1f;border:1px solid #ffffff33;border-radius:16px;padding:12px;margin-bottom:10px;font-size:14px;line-height:1.4}
#bn.bad{background:#7f1d1dcc;border-color:var(--r)}#bn.ok{background:#14532dcc;border-color:var(--g)}
.pb{height:10px;background:#ffffff33;border-radius:6px;overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;transition:width .6s}
#board{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:24px 12px;margin:14px 0 18px}
#rt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.slot{position:relative;aspect-ratio:300/154;border-radius:12px;border:2px dashed #ffffff77;background:#0b1437cc;overflow:hidden;z-index:1;transition:border-color .3s,box-shadow .3s}
.slot img{width:100%;height:100%;display:block;object-fit:cover}
.slot .n{position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--b);display:grid;place-items:center;font-weight:800;font-size:13px;z-index:2;box-shadow:0 0 0 2px #fff}
.slot.ok{border:2px solid var(--g);box-shadow:0 0 14px #22c55e88}
.slot.bad{border:2px solid var(--r);box-shadow:0 0 16px var(--r);background:#7f1d1d}
.slot.sh{animation:sh .4s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gm{position:absolute;font-size:20px;z-index:3;animation:crawl 2s ease-in-out infinite alternate}
@keyframes crawl{to{transform:translate(14px,-10px) rotate(40deg)}}
#germs{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
#germs span{position:absolute;font-size:26px;opacity:.85;animation:crawl 2.2s ease-in-out infinite alternate}
.lbl{font-size:13px;color:#ffffffc0;margin:0 0 8px}
#tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;min-height:60px}
.tile{touch-action:none;user-select:none;-webkit-user-select:none;background:#ffffff1f;border:2px solid #ffffff44;border-radius:10px;padding:3px;cursor:grab;transition:transform .15s}
.tile img{width:100%;display:block;border-radius:7px;pointer-events:none}
.tile div{font-size:10px;line-height:1.2;text-align:center;padding:3px 0 1px}
.tile.sel{border-color:var(--o);box-shadow:0 0 0 3px #ff4a0a55;transform:scale(1.05)}
.tile.ghost{position:fixed;width:92px;z-index:70;pointer-events:none;opacity:.92;transform:rotate(-4deg) scale(1.1);box-shadow:0 14px 30px #000a}
.win{position:absolute;inset:-8px;z-index:6;background:#06143bf2;border:3px solid var(--g);border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;animation:pop .6s}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
.win img{width:62%;background:#fff;border-radius:18px;padding:8px}.win h2{color:#4ade80;margin:10px 0 4px;font-size:28px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#0b1437ee;border-top:1px solid #ffffff33;display:flex;flex-direction:column;gap:8px;align-items:center}
#bar>*{width:100%;max-width:560px}
#ab{display:flex;gap:8px}
#pl{display:flex;align-items:center;gap:10px;background:#ffffff1f;border-radius:16px;padding:8px 12px}
#pl .av{width:38px;height:38px;border-radius:50%;background:var(--s);display:grid;place-items:center;font-weight:800;flex:none}
#pl b{display:block;font-size:15px}#pl small{color:#ffffffc0}
.row{display:flex;align-items:center;gap:10px;background:#ffffff1f;border-radius:14px;padding:10px 12px;margin-bottom:8px}
.row.me{border:2px solid var(--o)}.rk{width:34px;font-size:21px;font-weight:800;text-align:center}.row>div{flex:1;min-width:0}.row small{display:block;color:#ffffffb8}.row .pt{font-size:18px;color:#7cc8ff}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs .btn{height:44px;font-size:14px;padding:0 6px}
#cf{position:fixed;inset:0;z-index:80;pointer-events:none}
@media(min-width:700px){#tiles{grid-template-columns:repeat(6,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header><b>Marengo Asia Hospitals</b><div class="tools"><button id="mt" onclick="toggleMute()">🔊</button><button id="lg" onclick="toggleLang()">हिंदी</button></div></header>
<main>
<section id="s0"><div class="logo"><img id="lo" alt="Marengo Asia Hospitals"></div>
<h1 data-t="title"></h1><p class="sub" data-t="sub"></p>
<label for="eid" data-t="id"></label><input id="eid" autocomplete="off" autocapitalize="characters" placeholder="e.g. 10234">
<div style="display:flex;gap:8px"><button class="btn" onclick="start()" data-t="play"></button><button class="btn w" style="flex:0 0 auto" onclick="lb()">🏆</button></div>
<button class="link" onclick="S.pend=null;$('rnote').textContent='';show('s1')" data-t="reg"></button></section>
<section id="s1" hidden><h1 data-t="rn"></h1><p class="msg" id="rnote"></p>
<label for="rm" data-t="mob"></label><input id="rm" inputmode="numeric" maxlength="10" placeholder="10 digit number" onchange="mobBlur()">
<label for="rn" data-t="name"></label><input id="rn" autocomplete="off">
<label for="rd" data-t="dept"></label><input id="rd" list="dl" autocomplete="off"><datalist id="dl"></datalist>
<div style="display:flex;gap:8px;margin-top:6px"><button class="btn w" style="flex:0 0 100px" onclick="show('s0')" data-t="back"></button><button class="btn" onclick="regGo()" data-t="go"></button></div></section>
<section id="s2" hidden>
<div class="stat"><span class="chip">⏱ <span id="tm">00:00</span></span><span class="chip"><span data-t="att"></span> <span id="an">1</span></span></div>
<div id="bn" hidden></div>
<div id="board"><svg id="rt"></svg></div>
<p class="lbl" id="hd"></p><div id="tiles"></div>
<div id="germs"></div></section>
<section id="s3" hidden><div class="tabs"><button class="btn w" style="flex:0 0 80px" onclick="back()" data-t="back"></button><button class="btn" id="t0" onclick="tab('staff')" data-t="staff"></button><button class="btn w" id="t1" onclick="tab('depts')" data-t="deps"></button><button class="btn w" id="t2" onclick="tab('guests')" data-t="guests"></button></div><div id="lbc"></div></section>
</main>
<div id="bar" hidden><div id="ab"></div><div id="pl"><div class="av" id="av"></div><div><b id="pn"></b><small id="pi"></small></div></div></div>
<canvas id="cf" hidden></canvas>
<script>
const CFG={api:"PASTE_WEB_APP_URL_HERE",logo:"logo.webp",ver:"2.0"};
const ST=[["Wet hands","हाथ गीले करें"],["Apply soap","साबुन लगाएँ"],["Rub palms","हथेलियाँ रगड़ें"],["Back of hands","हाथ का पिछला भाग"],["Fingers interlaced","उंगलियाँ फँसाएँ"],["Back of fingers","उंगलियों के पीछे"],["Rub thumbs","अंगूठे रगड़ें"],["Fingertips","उंगलियों के सिरे"],["Rinse","पानी से धोएँ"],["Dry hands","हाथ सुखाएँ"],["Close tap","नल बंद करें"],["Hands safe","हाथ सुरक्षित"]];
const T={en:{title:"Hand Hygiene Challenge",sub:"Place the 12 handwash steps in the right order. Wrong order lets the germs in!",id:"Employee ID",play:"Play Game",reg:"No ID? Register here",rn:"Register to play",name:"Your name",dept:"Department / group",mob:"Mobile number",go:"Start",noid:"ID not found. Please fill your details to play.",fill:"Please fill all fields.",badmob:"Enter a 10 digit mobile number.",att:"Attempt",drag:"Drag each picture into its numbered box",check:"Check answer",ans:"Show correct order",again:"Play again",lb:"Leaderboard",back:"Back",clean:"Clean the germs",ok:"correct",pts:"points",cong:"Congratulations!",good:"Perfect! Clean hands save lives. Wash your hands at every moment that matters, every day.",risk:"Infection risk",r0:"Low",r1:"Medium",r2:"High",bad:"Wrong order! If the handwash steps are not done correctly, germs stay on your hands and the chance of infection rises.",fixing:"Drag the right pictures into the red boxes to wipe the germs away.",done:"Germs cleared! Now you know the right order. Keep washing your hands regularly.",saving:"Saving…",saved:"Saved ✔",retry:"Not saved yet. Will retry automatically.",staff:"Staff",deps:"Departments",guests:"Guests",empty:"No scores yet.",players:"played",off:"Cannot reach the server."},
hi:{title:"हैंड हाइजीन चैलेंज",sub:"हाथ धोने के 12 स्टेप सही क्रम में लगाएँ। गलत क्रम से कीटाणु आ जाते हैं!",id:"कर्मचारी ID",play:"गेम शुरू करें",reg:"ID नहीं है? यहाँ रजिस्टर करें",rn:"खेलने के लिए रजिस्टर करें",name:"आपका नाम",dept:"विभाग / समूह",mob:"मोबाइल नंबर",go:"शुरू करें",noid:"ID नहीं मिली। खेलने के लिए अपनी जानकारी भरें।",fill:"कृपया सभी जानकारी भरें।",badmob:"10 अंकों का मोबाइल नंबर डालें।",att:"प्रयास",drag:"हर चित्र को उसके नंबर वाले बॉक्स में खींचें",check:"उत्तर जाँचें",ans:"सही क्रम देखें",again:"फिर खेलें",lb:"लीडरबोर्ड",back:"वापस",clean:"कीटाणु साफ़ करें",ok:"सही",pts:"पॉइंट",cong:"बधाई हो!",good:"शानदार! साफ़ हाथ जीवन बचाते हैं। हर ज़रूरी मौके पर, हर दिन हाथ धोएँ।",risk:"संक्रमण का खतरा",r0:"कम",r1:"मध्यम",r2:"ज़्यादा",bad:"गलत क्रम! अगर हाथ धोने के स्टेप सही नहीं होंगे तो कीटाणु हाथों पर रह जाते हैं और संक्रमण का खतरा बढ़ता है।",fixing:"सही चित्रों को लाल बॉक्स में खींचें और कीटाणु साफ़ करें।",done:"कीटाणु साफ़! अब आप सही क्रम जानते हैं। नियमित रूप से हाथ धोते रहें।",saving:"सेव हो रहा है…",saved:"सेव हो गया ✔",retry:"अभी सेव नहीं हुआ। अपने आप दोबारा कोशिश होगी।",staff:"स्टाफ",deps:"विभाग",guests:"अतिथि",empty:"अभी कोई स्कोर नहीं।",players:"खेले",off:"सर्वर से संपर्क नहीं हुआ।"}};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={g(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let L=ls.g("hl")||"en";const t=k=>T[L][k]||T.en[k]||k;
const S={slots:Array(12).fill(null),tray:[],lock:new Set(),wrong:[],attempt:1,tab:"staff",mute:false};
const mmss=s=>String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function applyLang(){document.documentElement.lang=L;document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));$("lg").textContent=L=="en"?"हिंदी":"English";
 if(!$("s2").hidden){render();if(S.res)banner()}if(!$("s3").hidden)drawLB()}
function toggleLang(){L=L=="en"?"hi":"en";ls.s("hl",L);applyLang()}
function toggleMute(){S.mute=!S.mute;$("mt").textContent=S.mute?"🔇":"🔊"}
function show(id){["s0","s1","s2","s3"].forEach(x=>$(x).hidden=x!=id);$("bar").hidden=id!="s2";scrollTo(0,0)}
async function api(p){const r=await fetch(CFG.api+"?"+new URLSearchParams(p));return r.json()}
let ac;function tone(f,d=.1,ty="sine"){if(S.mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function confetti(n){const c=$("cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;c.hidden=false;const cols=["#0a3cff","#0a9bff","#ff4a0a","#22c55e","#facc15"];
 const P=Array.from({length:n},()=>({x:Math.random()*c.width,y:-Math.random()*c.height*.6,r:4+Math.random()*5,vy:2+Math.random()*4,vx:-2+Math.random()*4,a:Math.random()*6,k:cols[Math.random()*5|0]}));let f=0;
 (function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.k;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++f<240)requestAnimationFrame(a);else c.hidden=true})()}
/* login */
$("lo").src=CFG.logo;
async function who(k){try{return await api({a:"who",id:k})}catch(e){return null}}
async function start(){const id=$("eid").value.trim().toUpperCase();if(!id){alert(t("fill"));return}
 const r=await who(id);if(r&&r.found)return begin({key:id,id,name:r.name,dept:r.dept,type:r.type||"Staff"},r.attempts||0);
 S.pend=id;$("rnote").textContent=t("noid");show("s1")}
async function mobBlur(){const m=$("rm").value.replace(/\D/g,"");if(m.length!=10)return;const r=await who("M"+m);if(r&&r.found){$("rn").value=r.name;$("rd").value=r.dept}}
async function regGo(){const n=$("rn").value.trim(),d=$("rd").value.trim(),m=$("rm").value.replace(/\D/g,"");
 if(!n||!d){alert(t("fill"));return}if(m.length!=10){alert(t("badmob"));return}
 const key=S.pend||"M"+m,r=await who(key);begin({key,id:S.pend||"",name:n,dept:d,type:S.pend?"Unverified":"Guest",mobile:m},r&&r.attempts||0)}
function begin(e,prev){S.emp=e;S.attempt=prev+1;$("av").textContent=e.name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();$("pn").textContent=e.name;$("pi").textContent=(e.id?"ID "+e.id:"Guest")+" · "+e.dept;show("s2");newRound()}
(async()=>{try{const r=await api({a:"init"});$("dl").innerHTML=(r.departments||[]).map(d=>"<option value='"+esc(d)+"'>").join("")}catch(e){}})();
/* game */
function shuf(){const a=[...Array(12).keys()];for(let i=11;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function newRound(){S.slots=Array(12).fill(null);S.tray=shuf();S.lock=new Set();S.wrong=[];S.fix=false;S.done=false;S.won=false;S.res=null;S.sel=null;$("germs").innerHTML="";$("bn").hidden=true;$("an").textContent=S.attempt;S.t0=Date.now();
 clearInterval(S.tm);S.tm=setInterval(()=>{if(!S.done)$("tm").textContent=mmss((Date.now()-S.t0)/1000|0)},500);$("tm").textContent="00:00";render()}
function render(){const b=$("board");[...b.querySelectorAll(".slot,.win")].forEach(e=>e.remove());
 for(let i=0;i<12;i++){const r=i/3|0,c=r%2?2-i%3:i%3,s=document.createElement("div");s.className="slot";s.dataset.i=i;s.style.gridRow=r+1;s.style.gridColumn=c+1;
  if(S.lock.has(i)&&S.done)s.classList.add("ok");if(S.wrong.includes(i)){s.classList.add("bad");s.innerHTML="<span class=gm style='left:8%;top:30%'>🦠</span><span class=gm style='left:48%;top:12%;animation-delay:-.7s'>🦠</span><span class=gm style='left:66%;top:52%;animation-delay:-1.3s'>🦠</span>"}
  const n=document.createElement("span");n.className="n";n.textContent=i;s.append(n);
  if(S.slots[i]!=null){const m=new Image();m.src="img/s"+S.slots[i]+".webp";m.alt="";s.append(m)}b.append(s)}
 if(S.won){const w=document.createElement("div");w.className="win";w.innerHTML="<div><img src='"+CFG.logo+"' alt=''><h2>"+t("cong")+"</h2><b>"+esc(S.emp.name)+"</b><p>12/12 · "+S.res.p+" "+t("pts")+" · "+mmss(S.res.secs)+"</p></div>";b.append(w)}
 const tl=$("tiles");tl.innerHTML="";S.tray.forEach(id=>{const d=document.createElement("div");d.className="tile"+(S.sel===id?" sel":"");d.dataset.id=id;d.innerHTML="<img src='img/s"+id+".webp' alt=''><div>"+ST[id][L=="hi"?1:0]+"</div>";tl.append(d)});
 $("hd").textContent=S.done?"":t("drag");route();bar()}
function route(){const b=$("board"),sv=$("rt");let p="";for(let i=0;i<12;i++){const e=b.querySelector(".slot[data-i='"+i+"']");if(e)p+=(i?"L":"M")+(e.offsetLeft+e.offsetWidth/2)+" "+(e.offsetTop+e.offsetHeight/2)}
 const good=S.done&&!S.wrong.length;sv.innerHTML="<path d='"+p+"' fill='none' stroke='"+(good?"#22c55e":S.wrong.length?"#ef4444":"#0a9bff")+"' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='"+(good?"0":"2 9")+"' opacity='.9'/>"}
addEventListener("resize",route);
function shake(i){const e=document.querySelector(".slot[data-i='"+i+"']");if(e){e.classList.add("sh");setTimeout(()=>e.classList.remove("sh"),400)}}
function put(id,i){if(S.lock.has(i))return;
 if(S.fix){if(!S.wrong.includes(i))return;if(id==i){S.slots[i]=id;S.tray=S.tray.filter(x=>x!=id);S.lock.add(i);S.wrong=S.wrong.filter(x=>x!=i);S.sel=null;tone(880,.15,"triangle");vib(30);render();if(!S.wrong.length)fixed()}else{shake(i);tone(170,.2,"sawtooth");vib(80)}return}
 if(S.done)return;const old=S.slots[i];if(old!=null)S.tray.push(old);S.slots[i]=id;S.tray=S.tray.filter(x=>x!=id);S.sel=null;tone(680,.08);vib(15);render()}
$("board").addEventListener("click",e=>{const s=e.target.closest(".slot");if(!s||S.done&&!S.fix)return;const i=+s.dataset.i;
 if(S.sel!=null)put(S.sel,i);else if(S.slots[i]!=null&&!S.lock.has(i)&&!S.done){S.tray.push(S.slots[i]);S.slots[i]=null;render()}});
document.addEventListener("pointerdown",e=>{const tl=e.target.closest("#tiles .tile");if(!tl||S.done&&!S.fix)return;S.pd={id:+tl.dataset.id,x:e.clientX,y:e.clientY}});
addEventListener("pointermove",e=>{const p=S.pd;if(!p)return;if(!p.g&&Math.hypot(e.clientX-p.x,e.clientY-p.y)>8){const g=$("tiles").querySelector("[data-id='"+p.id+"']").cloneNode(true);g.className="tile ghost";document.body.append(g);p.g=g}
 if(p.g){p.g.style.left=e.clientX-46+"px";p.g.style.top=e.clientY-40+"px"}});
addEventListener("pointerup",e=>{const p=S.pd;if(!p)return;S.pd=null;
 if(p.g){p.g.hidden=true;const el=document.elementFromPoint(e.clientX,e.clientY);p.g.remove();const s=el&&el.closest(".slot");if(s)put(p.id,+s.dataset.i)}else{S.sel=S.sel==p.id?null:p.id;tone(520,.05);render()}});
addEventListener("pointercancel",()=>{if(S.pd&&S.pd.g)S.pd.g.remove();S.pd=null});
function check(){if(S.done||S.tray.length)return;S.done=true;clearInterval(S.tm);S.sel=null;
 const secs=(Date.now()-S.t0)/1000|0,c=S.slots.filter((v,i)=>v==i).length,perfect=c==12,bonus=perfect?Math.max(0,60-(secs/5|0)):0;S.res={c,p:c*10+bonus,secs,perfect};
 S.wrong=[];S.slots.forEach((v,i)=>{if(v==i)S.lock.add(i);else S.wrong.push(i)});
 if(perfect){S.won=true;[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.3,"triangle"),i*150));confetti(170)}else alarm();
 render();banner();scrollTo(0,0);save()}
function alarm(){document.body.classList.add("red");setTimeout(()=>document.body.classList.remove("red"),1900);vib([200,100,200,100,300]);tone(200,.4,"sawtooth");setTimeout(()=>tone(150,.5,"sawtooth"),350);
 const g=$("germs");g.innerHTML="";for(let i=0;i<Math.min(34,S.wrong.length*7);i++){const s=document.createElement("span");s.textContent="🦠";s.style.cssText="left:"+Math.random()*92+"%;top:"+Math.random()*92+"%;animation-delay:-"+Math.random()*2+"s";g.append(s)}}
function banner(){const r=S.res,w=S.wrong.length,lv=w==0?0:w<4?1:2,b=$("bn");b.hidden=false;b.className=r.perfect||S.finished?"ok":"bad";
 const msg=r.perfect?t("good"):S.fix?t("fixing"):S.finished?t("done"):t("bad");
 b.innerHTML="<b>"+r.c+"/12 "+t("ok")+" · "+r.p+" "+t("pts")+" · "+mmss(r.secs)+"</b>"+(r.perfect?"":"<div class=pb><i style='width:"+[15,55,100][lv]+"%;background:"+["#22c55e","#facc15","#ef4444"][lv]+"'></i></div><b>"+t("risk")+": "+t("r"+lv)+"</b>")+"<div style='margin-top:6px'>"+msg+"</div><div class=msg id=sv style='margin:6px 0 0'></div>";
}
function startFix(){S.fix=true;S.wrong.forEach(i=>{S.tray.push(S.slots[i]);S.slots[i]=null});render();banner()}
function fixed(){S.fix=false;S.finished=true;$("germs").innerHTML="";confetti(90);[523,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,"triangle"),i*140));render();banner();post({a:"fix",uid:S.uid})}
function showAns(){S.slots=[...Array(12).keys()];S.tray=[];S.lock=new Set(S.slots);S.wrong=[];S.fix=false;S.finished=true;$("germs").innerHTML="";render();banner()}
function again(){S.attempt++;S.finished=false;newRound()}
function bar(){const a=$("ab"),end=S.won||S.finished;
 a.innerHTML=!S.done?"<button class='btn' onclick='check()' "+(S.tray.length?"disabled":"")+">✔ "+t("check")+"</button>":end?"<button class='btn' onclick='again()'>🔄 "+t("again")+"</button><button class='btn s' onclick='lb()'>🏆 "+t("lb")+"</button>":"<button class='btn' onclick='startFix()'>🧼 "+t("clean")+"</button><button class='btn w' onclick='showAns()'>"+t("ans")+"</button>"}
/* saving */
async function post(d){try{const r=await fetch(CFG.api,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(d)});const j=await r.json();if(j.ok){if(j.attempt)S.attempt=j.attempt;return true}}catch(e){}return false}
async function save(){const r=S.res,e=S.emp;S.uid=Date.now()+"-"+Math.random().toString(36).slice(2,8);
 const d={a:"save",uid:S.uid,id:e.key,name:e.name,dept:e.dept,type:e.type,mobile:e.mobile||"",correct:r.c,points:r.p,secs:r.secs,lang:L,ver:CFG.ver},s=$("sv");if(s)s.textContent=t("saving");
 const ok=await post(d),s2=$("sv");if(ok){if(s2)s2.textContent=t("saved");flush()}else{const p=ls.g("pend")||[];p.push(d);ls.s("pend",p);if(s2)s2.textContent=t("retry")}}
async function flush(){const p=ls.g("pend")||[];if(!p.length)return;const k=[];for(const d of p)if(!(await post(d)))k.push(d);ls.s("pend",k)}
/* leaderboard */
async function lb(){show("s3");$("lbc").textContent="…";try{S.lbd=await api({a:"board"});drawLB()}catch(e){$("lbc").textContent=t("off")}}
function tab(x){S.tab=x;drawLB()}
function back(){show(S.emp&&S.t0?"s2":"s0")}
function drawLB(){const r=S.lbd;if(!r)return;["staff","depts","guests"].forEach((k,i)=>$("t"+i).className="btn"+(S.tab==k?"":" w")+"");$("t0").style.flex=$("t1").style.flex=$("t2").style.flex="1";let h="";const m=["🥇","🥈","🥉"],list=r[S.tab]||[];
 if(!list.length)h="<p>"+t("empty")+"</p>";
 list.forEach((x,i)=>{h+=S.tab=="depts"?"<div class=row><span class=rk>"+(m[i]||i+1)+"</span><div><b>"+esc(x.d)+"</b><small>"+x.players+(x.total?"/"+x.total:"")+" "+t("players")+"</small></div><b class=pt>"+x.avg+"</b></div>":"<div class='row"+(S.emp&&x.n==S.emp.name?" me":"")+"'><span class=rk>"+(m[i]||i+1)+"</span><div><b>"+esc(x.n)+"</b><small>"+esc(x.d)+" · "+mmss(x.s)+" · "+x.c+"/12</small></div><b class=pt>"+x.p+"</b></div>"});$("lbc").innerHTML=h}
applyLang();flush();show("s0");
</script></body></html>
